name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

# Deployments are handled by Vercel's native GitHub integration, which is
# already linked to this repo (project: it-helpdesk-1v7u):
#   push to main -> production   https://it-helpdesk-1v7u.vercel.app
#   push to dev  -> preview
# Do not add vercel-action jobs here — they duplicate that and require
# VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets to stay in sync.
